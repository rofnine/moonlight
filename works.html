  <style>
    html, body {
      height: auto !important;
      min-height: 100%;
      overflow-y: auto !important;
      overflow-x: hidden !important;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      display: none;
    }

    body {
      background: #111 url('assets/art_bg_2_1778838351889.png') center / cover fixed no-repeat;
      margin: 0;
      padding: 0;
      color: #fff;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.76);
      z-index: 1;
    }

    .content-wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 140px 40px 100px;
      text-align: left;
    }

    .works-header {
      margin-bottom: 54px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 30px;
    }

    .page-title {
      font-size: 16px;
      letter-spacing: 4px;
      color: rgba(255, 255, 255, 0.72);
      margin-bottom: 10px;
      font-weight: 400;
    }

    .works-name {
      font-size: clamp(34px, 5vw, 52px);
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 10px;
      line-height: 1.1;
    }

    .works-role {
      max-width: 860px;
      font-size: 18px;
      letter-spacing: 1.4px;
      color: #ccc;
      font-weight: 500;
      line-height: 1.7;
    }

    .work-section {
      margin-top: 62px;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }

    .section-title {
      font-size: 14px;
      letter-spacing: 3px;
      color: rgba(255, 255, 255, 0.65);
      text-transform: uppercase;
    }

    .more-link {
      flex: 0 0 auto;
      border: 1px solid rgba(255, 255, 255, 0.26);
      padding: 8px 12px;
      color: rgba(255, 255, 255, 0.86);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.3px;
      text-transform: uppercase;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .more-link:hover {
      border-color: rgba(255, 255, 255, 0.65);
      background-color: rgba(255, 255, 255, 0.12);
    }

    .section-note {
      max-width: 840px;
      margin: -6px 0 22px;
      color: rgba(255, 255, 255, 0.78);
      font-size: 15px;
      line-height: 1.75;
      word-break: keep-all;
    }

    .works-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .work-card {
      min-height: 100%;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      flex-direction: column;
      transition: border-color 0.25s ease, background-color 0.25s ease, transform 0.25s ease;
    }

    .work-card:hover {
      border-color: rgba(255, 255, 255, 0.45);
      background: rgba(255, 255, 255, 0.11);
      transform: translateY(-2px);
    }

    .work-image-link {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: 210px;
      overflow: hidden;
      background-color: rgba(255, 255, 255, 0.08);
    }

    .work-image-link.is-missing {
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.03)),
        rgba(255, 255, 255, 0.08);
    }

    .work-card img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      transition: transform 0.35s ease;
    }

    .work-card:hover img {
      transform: scale(1.035);
    }

    .work-copy {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 14px;
      padding: 24px;
    }

    .card-kicker {
      font-size: 12px;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.58);
      text-transform: uppercase;
    }

    .card-title {
      font-size: 22px;
      line-height: 1.35;
      font-weight: 700;
      word-break: keep-all;
    }

    .card-copy {
      color: #ddd;
      font-size: 14px;
      line-height: 1.75;
      word-break: keep-all;
    }

    .keyword-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: auto;
    }

    .keyword-list span {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 5px 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: rgba(255, 255, 255, 0.82);
      font-size: 12px;
      line-height: 1.3;
    }

    .work-link {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      gap: 8px;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .work-link::after {
      content: '->';
      font-size: 14px;
      line-height: 1;
    }

    @media (max-width: 980px) {
      .works-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 768px) {
      .site-header {
        padding-left: 12px;
        padding-right: 12px;
        overflow: hidden;
      }

      .header-right {
        width: 100%;
      }

      .nav-links {
        width: 100%;
        max-width: 340px;
        gap: 10px;
        font-size: 11px;
      }

      .content-wrapper {
        width: 100vw;
        max-width: 100vw;
        padding: 180px 18px 72px;
        overflow-x: hidden;
      }

      .section-heading {
        align-items: flex-start;
        flex-direction: column;
        gap: 10px;
      }

      .works-name {
        font-size: 30px;
        letter-spacing: 1px;
        overflow-wrap: anywhere;
      }

      .works-role,
      .section-note,
      .card-copy {
        letter-spacing: 0;
        word-break: normal;
        overflow-wrap: anywhere;
      }

      .works-grid {
        grid-template-columns: 1fr;
      }

      .work-copy {
        padding: 22px;
      }

      .card-title {
        font-size: 21px;
      }
    }

    @media (max-width: 420px) {
      .content-wrapper {
        padding-left: 14px;
        padding-right: 14px;
      }

      .nav-links {
        max-width: 300px;
        gap: 8px;
        font-size: 10px;
      }

      .nav-links a {
        letter-spacing: 0.5px;
      }

      .works-name {
        font-size: 28px;
      }

      .works-role {
        font-size: 16px;
        line-height: 1.65;

    const labels = {

    };

    const getText = (value, lang) => value[lang] || value.en;

    function normalizeLang(lang) {
      return supportedLangs.includes(lang) ? lang : 'en';
    }

    function getInitialLang() {
      try {
        return normalizeLang(localStorage.getItem(LANG_KEY));
      } catch (error) {
        return 'en';
      }
    }

    function renderWorks(lang) {
      const root = document.getElementById('works-root');
      root.innerHTML = sections.map(section => `
        <section class="work-section" id="${section.id}">
          <div class="section-heading">
            <h3 class="section-title">${section.title}</h3>
            <a class="more-link" href="works-list.html?type=${section.type}" target="_blank" rel="noopener noreferrer">${getText(labels.more, lang)}</a>
          </div>
          <p class="section-note">${getText(section.note, lang)}</p>
          <div class="works-grid">
            ${section.cards.map(card => `
              <article class="work-card">
                <a class="work-image-link" href="${card.link}" target="_blank" rel="noopener noreferrer">
                  <img src="${card.image}" alt="${getText(card.title, lang)}" onerror="this.parentElement.classList.add('is-missing'); this.remove();">
                </a>
                <div class="work-copy">
                  <p class="card-kicker">${card.kicker}</p>
                  <h4 class="card-title">${getText(card.title, lang)}</h4>
                  <p class="card-copy">${getText(card.copy, lang)}</p>
                  <div class="keyword-list">
                    ${card.keywords.map(keyword => `<span>${keyword}</span>`).join('')}
                  </div>
                  <a class="work-link" href="${card.link}" target="_blank" rel="noopener noreferrer">
                    ${card.link.startsWith('assets/') ? getText(labels.viewImage, lang) : getText(labels.viewWork, lang)}
                  </a>
                </div>
              </article>
            `).join('')}
          </div>
        </section>
      `).join('');
    }

    function setLang(lang) {
      const nextLang = normalizeLang(lang);
      document.documentElement.lang = nextLang;
      document.body.style.fontFamily = nextLang === 'ko'
        ? "var(--font-ko)"
        : "var(--font-en)";

      document.querySelectorAll('.i18n').forEach(el => {
        const value = el.getAttribute(`data-${nextLang}`);
        if (value) el.textContent = value;
      });

      document.querySelectorAll('.lang-switch a').forEach(link => {
        link.classList.toggle('active', link.dataset.lang === nextLang);
      });

      try {
        localStorage.setItem(LANG_KEY, nextLang);
      } catch (error) {
        // Continue without persistence if localStorage is unavailable.
      }

      renderWorks(nextLang);
    }

    document.querySelectorAll('.lang-switch a').forEach(link => {
      link.addEventListener('click', event => {
        event.preventDefault();
        setLang(link.dataset.lang);
      });
    });

    setLang(getInitialLang());
  </script>
