<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POSTER DETAIL | MOON BITNA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    html,
    body {
      min-height: 100%;
      height: auto !important;
      overflow-y: auto !important;
      overflow-x: hidden !important;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      display: none;
    }

    body {
      margin: 0;
      background: #101112 url('assets/art_bg_2_1778838351889.jpg') center / cover fixed no-repeat;
      color: #fff;
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: rgba(0, 0, 0, 0.78);
    }

    .poster-detail {
      position: relative;
      z-index: 2;
      max-width: 1120px;
      margin: 0 auto;
      padding: 140px 40px 90px;
    }

    .detail-top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 28px;
      align-items: end;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 30px;
      margin-bottom: 38px;
    }

    .eyebrow {
      color: rgba(255, 255, 255, 0.62);
      font-size: 14px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .detail-title {
      font-size: clamp(30px, 4.5vw, 46px);
      line-height: 1.08;
      letter-spacing: 1px;
      margin-bottom: 16px;
      word-break: keep-all;
    }

    .detail-summary {
      max-width: 820px;
      color: rgba(255, 255, 255, 0.78);
      font-size: 16px;
      line-height: 1.75;
      word-break: keep-all;
    }

    .back-link {
      border: 1px solid rgba(255, 255, 255, 0.26);
      padding: 10px 14px;
      color: rgba(255, 255, 255, 0.9);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .poster-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
    }

    .poster-meta span {
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 5px 9px;
      color: rgba(255, 255, 255, 0.82);
      font-size: 12px;
    }

    .poster-gallery {
      display: grid;
      gap: 24px;
    }

    .poster-frame {
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.07);
      padding: 14px;
    }

    .poster-frame img {
      width: 100%;
      max-height: 1150px;
      object-fit: contain;
      display: block;
      background: rgba(255, 255, 255, 0.06);
    }

    .poster-count {
      margin: 0 0 10px;
      color: rgba(255, 255, 255, 0.62);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }

    @media (max-width: 768px) {
      .site-header {
        padding-left: 12px;
        padding-right: 12px;
        overflow: hidden;
      }

      .header-right {
        width: 100%;
      }

      .nav-links {
        width: 100%;
        max-width: 340px;
        gap: 10px;
        font-size: 11px;
      }

      .poster-detail {
        width: 100vw;
        max-width: 100vw;
        padding: 180px 14px 70px;
      }

      .detail-top {
        display: block;
      }

      .back-link {
        display: inline-flex;
        margin-top: 22px;
      }

      .detail-summary {
        word-break: normal;
        overflow-wrap: anywhere;
      }

      .poster-frame {
        padding: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="overlay"></div>

  <header class="site-header">
    <div class="logo"><a href="index.html">MOON BITNA</a></div>
    <div class="header-right">
      <div class="lang-switch">
        <a href="#" data-lang="en" class="active">EN</a>
        <a href="#" data-lang="ko">KO</a>
        <a href="#" data-lang="ja">JA</a>
      </div>
      <nav class="nav-links">
        <a href="index.html#slide-1" class="i18n" data-en="PROFILE" data-ko="프로필" data-ja="プロフィール">PROFILE</a>
        <a href="index.html#slide-2" class="i18n" data-en="PROJECTS" data-ko="프로젝트" data-ja="プロジェクト">PROJECTS</a>
        <a href="index.html#slide-3" class="i18n" data-en="WORKS" data-ko="작업물" data-ja="作品">WORKS</a>
        <a href="index.html#slide-4" class="i18n" data-en="STRATEGY" data-ko="전략" data-ja="戦略">STRATEGY</a>
        <a href="index.html#slide-5" class="i18n" data-en="CONTACT" data-ko="연락처" data-ja="連絡先">CONTACT</a>
      </nav>
    </div>
  </header>

  <main class="poster-detail">
    <section class="detail-top">
      <div>
        <p class="eyebrow i18n" data-en="POSTER GALLERY" data-ko="포스터 갤러리" data-ja="ポスターギャラリー">POSTER GALLERY</p>
        <h1 class="detail-title" id="detail-title">Poster Detail</h1>
        <p class="detail-summary" id="detail-summary"></p>
        <div class="poster-meta" id="poster-meta"></div>
      </div>
      <a class="back-link i18n" href="works-list.html?type=poster" data-en="Back to Poster List" data-ko="포스터 목록으로" data-ja="ポスター一覧へ">Back to Poster List</a>
    </section>

    <section class="poster-gallery" id="poster-gallery"></section>
  </main>

  <script src="works-list-data.js"></script>
  <script>
    const LANG_KEY = 'moonBitnaLang';
    const supportedLangs = ['en', 'ko', 'ja'];
    const labels = {
      item: { en: 'Poster', ko: '포스터', ja: 'ポスター' },
      notFound: { en: 'Poster work not found.', ko: '포스터 작업물을 찾을 수 없습니다.', ja: 'ポスター作品が見つかりません。' }
    };

    function normalizeLang(lang) {
      return supportedLangs.includes(lang) ? lang : 'en';
    }

    function getInitialLang() {
      try {
        return normalizeLang(localStorage.getItem(LANG_KEY));
      } catch (error) {
        return 'en';
      }
    }

    function getText(value, lang) {
      if (!value) return '';
      if (typeof value === 'string') return value;
      return value[lang] || value.en || value.ko || value.ja || '';
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getPosterItem() {
      const id = new URLSearchParams(window.location.search).get('id');
      const posters = window.worksCollections.poster || [];
      return posters.find(item => item.id === id) || posters[0];
    }

    function render(lang) {
      const item = getPosterItem();
      document.documentElement.lang = lang;
      document.body.style.fontFamily = lang === 'ko' ? "var(--font-ko)" : "var(--font-en)";

      document.querySelectorAll('.i18n').forEach(el => {
        const value = el.getAttribute(`data-${lang}`);
        if (value) el.textContent = value;
      });

      document.querySelectorAll('.lang-switch a').forEach(link => {
        link.classList.toggle('active', link.dataset.lang === lang);
      });

      if (!item) {
        document.getElementById('detail-title').textContent = getText(labels.notFound, lang);
        return;
      }

      const title = getText(item.title, lang);
      document.title = `${title} | MOON BITNA`;
      document.getElementById('detail-title').textContent = title;
      document.getElementById('detail-summary').textContent = getText(item.summary, lang);
      document.getElementById('poster-meta').innerHTML = (item.tags || []).map(tag => `<span>${escapeHtml(tag)}</span>`).join('');
      document.getElementById('poster-gallery').innerHTML = (item.images || [item.image]).map((src, index) => `
        <article class="poster-frame">
          <p class="poster-count">${getText(labels.item, lang)} ${index + 1} / ${(item.images || [item.image]).length}</p>
          <img src="${escapeHtml(src)}" alt="${escapeHtml(title)} ${index + 1}">
        </article>
      `).join('');
    }

    function setLang(lang) {
      const nextLang = normalizeLang(lang);
      try {
        localStorage.setItem(LANG_KEY, nextLang);
      } catch (error) {
        // Continue without persistence if localStorage is unavailable.
      }
      render(nextLang);
    }

    document.querySelectorAll('.lang-switch a').forEach(link => {
      link.addEventListener('click', event => {
        event.preventDefault();
        setLang(link.dataset.lang);
      });
    });

    render(getInitialLang());
  </script>
</body>
</html>
