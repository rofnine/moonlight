<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WORKS LIST | MOON BITNA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    html, body {
      min-height: 100%;
      height: auto !important;
      overflow-y: auto !important;
      overflow-x: hidden !important;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      display: none;
    }

    body {
      margin: 0;
      padding: 0;
      background: #101112 url('assets/art_bg_2_1778838351889.png') center / cover fixed no-repeat;
      color: #fff;
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: rgba(0, 0, 0, 0.78);
    }

    .list-wrapper {
      position: relative;
      z-index: 2;
      max-width: 1180px;
      margin: 0 auto;
      padding: 140px 40px 90px;
    }

    .list-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 28px;
      margin-bottom: 42px;
    }

    .eyebrow {
      margin-bottom: 12px;
      color: rgba(255, 255, 255, 0.62);
      font-size: 14px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .list-title {
      font-size: clamp(30px, 4.5vw, 46px);
      line-height: 1.1;
      letter-spacing: 1.5px;
      margin-bottom: 14px;
    }

    .list-note {
      max-width: 760px;
      color: rgba(255, 255, 255, 0.78);
      font-size: 16px;
      line-height: 1.7;
    }

    .back-link {
      flex: 0 0 auto;
      border: 1px solid rgba(255, 255, 255, 0.26);
      padding: 10px 14px;
      color: rgba(255, 255, 255, 0.9);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }

    .feed-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .feed-card {
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      min-width: 0;
    }

    .feed-image {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.08);
    }

    .feed-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .feed-copy {
      padding: 22px;
    }

    .feed-date {
      color: rgba(255, 255, 255, 0.56);
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .feed-title {
      font-size: 20px;
      line-height: 1.35;
      margin-bottom: 12px;
      word-break: keep-all;
    }

    .feed-summary {
      color: rgba(255, 255, 255, 0.78);
      font-size: 14px;
      line-height: 1.7;
      word-break: keep-all;
      margin-bottom: 18px;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    .tag-list span {
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 5px 9px;
      color: rgba(255, 255, 255, 0.82);
      font-size: 12px;
    }

    .feed-link {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }

    .feed-link::after {
      content: ' ->';
    }

    @media (max-width: 980px) {
      .feed-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 768px) {
      .site-header {
        padding-left: 12px;
        padding-right: 12px;
        overflow: hidden;
      }

      .header-right {
        width: 100%;
      }

      .nav-links {
        width: 100%;
        max-width: 340px;
        gap: 10px;
        font-size: 11px;
      }

      .list-wrapper {
        width: 100vw;
        max-width: 100vw;
        padding: 180px 14px 72px;
      }

      .list-header {
        display: block;
      }

      .back-link {
        display: inline-flex;
        margin-top: 22px;
      }

      .feed-grid {
        grid-template-columns: 1fr;
      }

      .list-note,
      .feed-summary {
        word-break: normal;
        overflow-wrap: anywhere;
      }
    }
  </style>
</head>
<body>
  <div class="overlay"></div>

  <header class="site-header">
    <div class="logo"><a href="index.html">MOON BITNA</a></div>
    <div class="header-right">
      <div class="lang-switch">
        <a href="#" data-lang="en" class="active">EN</a>
        <a href="#" data-lang="ko">KO</a>
        <a href="#" data-lang="ja">JA</a>
      </div>
      <nav class="nav-links">
        <a href="index.html#slide-1" class="i18n" data-en="PROFILE" data-ko="프로필" data-ja="プロフィール">PROFILE</a>
        <a href="index.html#slide-2" class="i18n" data-en="PROJECTS" data-ko="프로젝트" data-ja="プロジェクト">PROJECTS</a>
        <a href="index.html#slide-3" class="i18n" data-en="WORKS" data-ko="작업물" data-ja="ワークス">WORKS</a>
        <a href="index.html#slide-4" class="i18n" data-en="STRATEGY" data-ko="전략" data-ja="戦略">STRATEGY</a>
        <a href="index.html#slide-5" class="i18n" data-en="CONTACT" data-ko="연락처" data-ja="連絡先">CONTACT</a>
      </nav>
    </div>
  </header>

  <main class="list-wrapper">
    <section class="list-header">
      <div>
        <p class="eyebrow" id="list-eyebrow">WORKS FEED</p>
        <h1 class="list-title" id="list-title">Works Feed</h1>
        <p class="list-note" id="list-note"></p>
      </div>
      <a class="back-link i18n" href="works.html" data-en="Back to Works" data-ko="작업물로 돌아가기" data-ja="ワークスへ戻る">Back to Works</a>
    </section>

    <section class="feed-grid" id="feed-grid"></section>
  </main>

  <script src="works-list-data.js"></script>
  <script>
    const LANG_KEY = 'moonBitnaLang';
    const supportedLangs = ['en', 'ko', 'ja'];

    const meta = {
      foodBlog: {
        title: { en: 'Restaurant Blog Feed', ko: '맛집 블로그 전체 글', ja: 'グルメブログ全投稿' },
        note: { en: 'All restaurant-blog posts available from the public Naver RSS feed.', ko: '네이버 공개 RSS에서 확인 가능한 맛집 블로그 포스팅 목록입니다.', ja: 'Naver公開RSSで確認できるグルメブログ投稿一覧です。' }
      },
      cleaningBlog: {
        title: { en: 'Move-in Cleaning Blog Feed', ko: '입주청소 블로그 전체 글', ja: '入居清掃ブログ全投稿' },
        note: { en: 'All move-in-cleaning posts available from the public Naver RSS feed.', ko: '네이버 공개 RSS에서 확인 가능한 입주청소 블로그 포스팅 목록입니다.', ja: 'Naver公開RSSで確認できる入居清掃ブログ投稿一覧です。' }
      },
      instagram: {
        title: { en: 'Instagram Feed', ko: '인스타그램 피드', ja: 'Instagramフィード' },
        note: { en: 'Instagram work posts provided for this portfolio. Use each card to open the original post.', ko: '포트폴리오에 제공된 인스타그램 작업물입니다. 각 카드를 누르면 원본 게시글로 이동합니다.', ja: 'ポートフォリオ用に提供されたInstagram作品です。各カードから元投稿へ移動できます。' }
      },
      youtube: {
        title: { en: 'YouTube Shorts Feed', ko: '유튜브 쇼츠 전체 글', ja: 'YouTube Shorts一覧' },
        note: { en: 'Shorts available from the public YouTube channel RSS feed.', ko: '유튜브 공개 채널 RSS에서 확인 가능한 쇼츠 목록입니다.', ja: 'YouTube公開チャンネルRSSで確認できるShorts一覧です。' }
      },
      poster: {
        title: { en: 'Poster Works', ko: '포스터 작업물', ja: 'ポスター作品' },
        note: { en: 'Personal poster works collected as local artwork files.', ko: '개인적으로 제작한 포스터 작업물을 모아둔 목록입니다.', ja: '個人制作のポスター作品をまとめた一覧です。' }
      }
    };

    const labels = {
      open: { en: 'Open Work', ko: '작업물 열기', ja: '作品を開く' }
    };

    function normalizeLang(lang) {
      return supportedLangs.includes(lang) ? lang : 'en';
    }

    function getInitialLang() {
      try {
        return normalizeLang(localStorage.getItem(LANG_KEY));
      } catch (error) {
        return 'en';
      }
    }

    function getText(value, lang) {
      if (!value) return '';
      if (typeof value === 'string') return value;
      return value[lang] || value.en || value.ko || value.ja || '';
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getType() {
      const type = new URLSearchParams(window.location.search).get('type');
      return window.worksCollections[type] ? type : 'foodBlog';
    }

    function render(lang) {
      const type = getType();
      const info = meta[type];
      const items = window.worksCollections[type] || [];
      document.documentElement.lang = lang;
      document.body.style.fontFamily = lang === 'ko' ? "var(--font-ko)" : "var(--font-en)";
      document.title = `${getText(info.title, lang)} | MOON BITNA`;
      document.getElementById('list-title').textContent = getText(info.title, lang);
      document.getElementById('list-note').textContent = getText(info.note, lang);

      document.querySelectorAll('.i18n').forEach(el => {
        const value = el.getAttribute(`data-${lang}`);
        if (value) el.textContent = value;
      });

      document.querySelectorAll('.lang-switch a').forEach(link => {
        link.classList.toggle('active', link.dataset.lang === lang);
      });

      document.getElementById('feed-grid').innerHTML = items.map(item => {
        const title = getText(item.title, lang);
        const summary = getText(item.summary, lang);
        const date = getText(item.date, lang);
        const isExternal = /^https?:\/\//.test(item.link);
        const target = isExternal ? ' target="_blank" rel="noopener noreferrer"' : '';
        return `
        <article class="feed-card">
          <a class="feed-image" href="${item.link}"${target}>
            ${item.image ? `<img src="${escapeHtml(item.image)}" alt="${escapeHtml(title)}">` : ''}
          </a>
          <div class="feed-copy">
            <p class="feed-date">${escapeHtml(date)}</p>
            <h2 class="feed-title">${escapeHtml(title)}</h2>
            <p class="feed-summary">${escapeHtml(summary)}</p>
            <div class="tag-list">${(item.tags || []).map(tag => `<span>${escapeHtml(tag)}</span>`).join('')}</div>
            <a class="feed-link" href="${item.link}"${target}>${getText(labels.open, lang)}</a>
          </div>
        </article>
      `;
      }).join('');
    }

    function setLang(lang) {
      const nextLang = normalizeLang(lang);
      try {
        localStorage.setItem(LANG_KEY, nextLang);
      } catch (error) {
        // Continue without persistence if localStorage is unavailable.
      }
      render(nextLang);
    }

    document.querySelectorAll('.lang-switch a').forEach(link => {
      link.addEventListener('click', event => {
        event.preventDefault();
        setLang(link.dataset.lang);
      });
    });

    render(getInitialLang());
  </script>
</body>
</html>
