<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PROFILE | MOON BITNA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    html, body { height: auto !important; min-height: 100%; overflow: visible !important; }
    html { scroll-snap-type: y mandatory; scroll-behavior: smooth; }
    body { margin: 0; background: #f8f8f6; color: #171717; }
    .profile-story, .profile-story * { box-sizing: border-box; }
    .profile-story { position: relative; padding-top: 112px; }

    .story-section {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, .9fr) minmax(320px, 1.1fr);
      align-items: center;
      gap: clamp(40px, 7vw, 110px);
      min-height: 100vh;
      padding: 130px max(6vw, 32px);
      overflow: hidden;
      scroll-snap-align: start;
      scroll-snap-stop: always;
    }
    .story-section:nth-child(even) { background: #f1f1ed; }
    .story-section:nth-child(odd) { background: #fff; }
    .story-section--reverse .story-copy { order: 2; }
    .story-section--reverse .story-image { order: 1; }
    .story-copy, .story-image {
      opacity: 0;
      transform: translateY(70px);
      filter: blur(10px);
      transition: opacity 1.15s cubic-bezier(.16,1,.3,1), transform 1.15s cubic-bezier(.16,1,.3,1), filter 1.15s cubic-bezier(.16,1,.3,1);
    }
    .story-section.is-visible .story-copy,
    .story-section.is-visible .story-image { opacity: 1; transform: translateY(0); filter: blur(0); }
    .story-section.is-visible .story-image { transition-delay: 160ms; }
    .story-index { display: block; margin-bottom: 22px; color: #8a8a84; font-size: 12px; letter-spacing: 3px; }
    .story-word {
      display: inline-block;
      padding: 0;
      border: 0;
      border-bottom: 1px solid transparent;
      background: transparent;
      color: #171717;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(62px, 10vw, 150px);
      font-style: italic;
      font-weight: 500;
      line-height: .88;
      letter-spacing: 0;
      cursor: pointer;
      transition: border-color .25s ease, opacity .25s ease;
    }
    .story-word:hover, .story-word:focus-visible { border-color: #171717; opacity: .72; outline: none; }
    .story-hint { margin: 30px 0 0; color: #73736e; font-size: 14px; letter-spacing: .5px; }
    .story-image { margin: 0; }
    .story-image img { display: block; width: 100%; max-height: 70vh; object-fit: cover; }
    .story-image--sensitive img { aspect-ratio: 1.28; }
    .story-image--archive img { aspect-ratio: 1.45; }
    .story-image--intuitive img { aspect-ratio: 1.5; }
    .story-image figcaption { margin-top: 12px; color: #898983; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; }

    .word-modal {
      position: fixed;
      inset: 0;
      z-index: 300;
      display: grid;
      place-items: center;
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s ease;
    }
    .word-modal.is-open { opacity: 1; pointer-events: auto; }
    .word-modal-backdrop { position: absolute; inset: 0; background: rgba(15,15,15,.62); backdrop-filter: blur(8px); }
    .word-panel {
      position: relative;
      z-index: 1;
      width: min(820px, 100%);
      max-height: calc(100vh - 48px);
      overflow-y: auto;
      padding: clamp(38px, 7vw, 80px);
      background: #fff;
      box-shadow: 0 32px 100px rgba(0,0,0,.22);
    }
    .word-close { position: absolute; top: 18px; right: 22px; width: 38px; height: 38px; border: 0; background: transparent; color: #171717; font-size: 28px; cursor: pointer; }
    .word-modal-label { margin: 0 0 18px; color: #8a8a84; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; }
    .word-modal-title { margin: 0 0 30px; font-family: 'Cormorant Garamond', serif; font-size: clamp(54px, 9vw, 100px); font-style: italic; font-weight: 500; line-height: .9; }
    .word-modal-copy { margin: 0; color: #3c3c39; font-size: 17px; line-height: 2; word-break: keep-all; }

    @media (max-width: 768px) {
      .profile-story { padding-top: 148px; }
      .story-section { grid-template-columns: 1fr; min-height: 100vh; padding: 120px 22px; }
      .story-section--reverse .story-copy, .story-section--reverse .story-image { order: initial; }
      .story-word { font-size: clamp(58px, 22vw, 92px); overflow-wrap: anywhere; }
      .story-image img { max-height: none; }
      .word-panel { padding: 56px 25px 38px; }
      .word-modal-copy { font-size: 15px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .story-copy, .story-image { transition: none; filter: none; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="logo"><a href="index.html">MOON BITNA</a></div>
    <div class="header-right">
      <div class="lang-switch">
        <a href="#" class="active" onclick="setLang('en'); return false;">EN</a>
        <a href="#" onclick="setLang('ko'); return false;">KO</a>
        <a href="#" onclick="setLang('ja'); return false;">JA</a>
      </div>
      <nav class="nav-links">
        <a href="index.html#slide-1" class="i18n" data-en="PROFILE" data-ko="프로필" data-ja="プロフィール">PROFILE</a>
        <a href="index.html#slide-2" class="i18n" data-en="PROJECTS" data-ko="프로젝트" data-ja="プロジェクト">PROJECTS</a>
        <a href="index.html#slide-3" class="i18n" data-en="WORKS" data-ko="작업물" data-ja="制作物">WORKS</a>
        <a href="index.html#slide-4" class="i18n" data-en="STRATEGY" data-ko="전략" data-ja="戦略">STRATEGY</a>
        <a href="index.html#slide-5" class="i18n" data-en="CONTACT" data-ko="연락처" data-ja="連絡先">CONTACT</a>
      </nav>
    </div>
  </header>

  <main class="profile-story">
    <section class="story-section" data-story>
      <div class="story-copy">
        <span class="story-index">01 / ATTITUDE</span>
        <button class="story-word" type="button" data-word="sensitive" data-en="SENSITIVE" data-ko="섬세함" data-ja="感受性">SENSITIVE</button>
        <p class="story-hint i18n" data-en="Click the word to read my story." data-ko="단어를 누르면 제 이야기가 열립니다." data-ja="言葉をクリックすると、私の物語が開きます。">Click the word to read my story.</p>
      </div>
      <figure class="story-image story-image--sensitive">
        <img src="assets/profile-works.jpg" alt="흐릿한 꽃의 움직임을 담은 예술 사진">
        <figcaption class="i18n" data-en="Noticing small reactions" data-ko="작은 반응을 알아차리는 감각" data-ja="小さな反応に気づく感覚">Noticing small reactions</figcaption>
      </figure>
    </section>

    <section class="story-section story-section--reverse" data-story>
      <div class="story-copy">
        <span class="story-index">02 / METHOD</span>
        <button class="story-word" type="button" data-word="archive" data-en="Archive" data-ko="기록" data-ja="記録">Archive</button>
        <p class="story-hint i18n" data-en="Click the word to read my story." data-ko="단어를 누르면 제 이야기가 열립니다." data-ja="言葉をクリックすると、私の物語が開きます。">Click the word to read my story.</p>
      </div>
      <figure class="story-image story-image--archive">
        <img src="assets/profile-archive.jpg" alt="물 위의 꽃을 기록한 예술 사진">
        <figcaption class="i18n" data-en="Collecting evidence and context" data-ko="근거와 맥락을 축적하는 기록" data-ja="根拠と文脈を蓄積する記録">Collecting evidence and context</figcaption>
      </figure>
    </section>

    <section class="story-section" data-story>
      <div class="story-copy">
        <span class="story-index">03 / DECISION</span>
        <button class="story-word" type="button" data-word="intuitive" data-en="Intuitive" data-ko="직관" data-ja="直感">Intuitive</button>
        <p class="story-hint i18n" data-en="Click the word to read my story." data-ko="단어를 누르면 제 이야기가 열립니다." data-ja="言葉をクリックすると、私の物語が開きます。">Click the word to read my story.</p>
      </div>
      <figure class="story-image story-image--intuitive">
        <img src="assets/profile-intuitive.jpg" alt="초록빛 형태가 번지는 추상 사진">
        <figcaption class="i18n" data-en="Turning patterns into direction" data-ko="패턴을 방향으로 바꾸는 판단" data-ja="パターンを方向へ変える判断">Turning patterns into direction</figcaption>
      </figure>
    </section>
  </main>

  <div class="word-modal" id="word-modal" aria-hidden="true">
    <div class="word-modal-backdrop" data-close-modal></div>
    <section class="word-panel" role="dialog" aria-modal="true" aria-labelledby="word-modal-title">
      <button class="word-close" type="button" data-close-modal aria-label="닫기">×</button>
      <p class="word-modal-label i18n" data-en="MOON BITNA / PROFILE" data-ko="문빛나 / 프로필" data-ja="ムン・ビンナ / プロフィール">MOON BITNA / PROFILE</p>
      <h2 class="word-modal-title" id="word-modal-title"></h2>
      <p class="word-modal-copy"></p>
    </section>
  </div>

  <script>
    const supportedLangs = ['en', 'ko', 'ja'];
    const profileStories = {
      sensitive: {
        en: {
          title: 'SENSITIVE',
          copy: 'I am a marketer who notices small differences in people’s reactions. While managing university programs, I monitored attendance and participation closely so I could respond before schedules began to drift. In content work, I observe where people stop, what they search for, and which keywords bring them in. More than 10,000 accumulated YouTube Shorts views and four-digit traffic from a single blog post came from repeatedly reading these subtle signals and applying them to the next piece of content. To me, being sensitive means accurately catching the moment when taste and emotion begin to move.'
        },
        ko: {
          title: '섬세함',
          copy: '저는 작은 반응의 차이를 놓치지 않는 마케터입니다. 대학 사업을 운영할 때에는 연수생의 출결과 참여도 변화를 계속 살피며 일정이 흔들리기 전에 대응했고, 콘텐츠를 만들 때에는 사람들이 어디에서 멈추고 어떤 키워드로 들어오는지 관찰했습니다. 유튜브 쇼츠 누적 조회수 1만 회 이상, 블로그 단일 포스팅 네 자릿수 유입은 감각만으로 얻은 결과가 아니라 미세한 반응을 꾸준히 읽고 다음 콘텐츠에 반영한 결과입니다. 저에게 섬세함은 쉽게 흔들린다는 뜻이 아니라, 사람의 취향과 감정이 움직이는 순간을 정확하게 포착하는 능력입니다.'
        },
        ja: {
          title: '感受性',
          copy: '私は、人の小さな反応の違いを見逃さないマーケターです。大学事業の運営では、研修生の出欠や参加度を継続的に確認し、予定が崩れる前に対応しました。コンテンツ制作では、人がどこで立ち止まり、何を検索し、どのキーワードから流入するのかを観察しています。YouTubeショート累計1万回以上の再生と、ブログ1記事による4桁の流入は、細かな反応を読み、次の企画へ反映し続けた結果です。私にとって感受性とは、好みや感情が動く瞬間を丁寧に捉える力です。'
        }
      },
      archive: {
        en: {
          title: 'Archive',
          copy: 'I do not simply store scattered information. I organize it into standards that can be retrieved and used again. At Hoseo University, I managed data for ten project groups with a total budget of approximately KRW 568 million and unified inconsistent calculation standards for enrollment, employment, and dropout rates. Building comparable evaluation data contributed to improved performance indicator achievement. The recording habits I developed through accounting and administration continue in content work: I collect keywords, traffic paths, reaction rates, and audience language, then connect them as evidence for the next plan.'
        },
        ko: {
          title: '기록',
          copy: '저는 흩어진 정보를 쌓아 두는 데서 멈추지 않고, 다시 꺼내 쓸 수 있는 기준으로 정리합니다. 호서대학교에서는 10개 사업단, 약 5억 6,800만 원 규모 사업의 자료를 관리하며 사업단마다 달랐던 재학률·취업률·중도탈락률 산정 기준을 통일했습니다. 비교 가능한 평가 자료를 구축한 결과 성과지표 달성률 향상에도 기여했습니다. 회계 전공과 행정 실무에서 익힌 기록 습관은 콘텐츠에서도 이어집니다. 키워드, 유입 경로, 반응률과 팬의 언어를 축적하고 연결해 다음 기획의 근거로 만드는 것이 제가 생각하는 기록입니다.'
        },
        ja: {
          title: '記録',
          copy: '私は、散らばった情報をただ保存するのではなく、再び活用できる基準へ整理します。湖西大学では、10事業団、総事業費約5億6,800万ウォン規模の資料を管理し、在学率・就職率・中途離脱率の計算基準を統一しました。比較可能な評価資料を構築し、成果指標の達成率向上にも貢献しました。会計と行政実務で身につけた記録習慣は、コンテンツ制作にもつながっています。キーワード、流入経路、反応率、ファンの言葉を蓄積し、次の企画の根拠へ変えることが私の考える記録です。'
        }
      },
      intuitive: {
        en: {
          title: 'Intuitive',
          copy: 'My intuition is not a momentary guess. It is the ability to choose a direction quickly after enough observation and organization. At Baekseok Culture University, when attendance standards, instructor schedules, and operating guidelines changed at the same time, I visualized the entire workflow and reset priorities to keep the program stable. This series of decisions helped produce a combined completion rate of 95% and an overseas employment rate of 70%. In content work, I study numbers and reactions before deciding what will attract people and which expression will reach them more clearly.'
        },
        ko: {
          title: '직관',
          copy: '저의 직관은 순간적인 감이 아니라 충분히 관찰하고 정리한 뒤 빠르게 방향을 선택하는 힘입니다. 백석문화대학교에서 출결 기준, 강사 일정, 운영 지침이 동시에 바뀌었을 때 전체 업무 흐름을 먼저 시각화하고 우선순위를 다시 세워 사업을 안정적으로 운영했습니다. 두 과정 합산 수료율 95%, 해외취업률 70%라는 결과도 이러한 판단의 연속에서 만들어졌습니다. 콘텐츠에서도 숫자와 반응을 오래 들여다본 뒤 사람들이 무엇에 끌릴지, 어떤 표현이 더 쉽게 닿을지를 결정합니다. 저에게 직관은 근거가 쌓인 뒤 자연스럽게 도착하는 빠르고 명확한 선택입니다.'
        },
        ja: {
          title: '直感',
          copy: '私の直感は、その場の思いつきではありません。十分に観察し、整理した後で素早く方向を選ぶ力です。白石文化大学では、出欠基準、講師の日程、運営指針が同時に変更された際、業務全体を可視化し、優先順位を再設定して事業を安定的に運営しました。その判断の積み重ねが、2課程合計修了率95％、海外就職率70％という成果につながりました。コンテンツでも数字と反応を見た上で、人が何に惹かれ、どの表現が届きやすいかを判断します。'
        }
      }
    };

    function normalizeLang(lang) {
      return supportedLangs.includes(lang) ? lang : 'en';
    }

    function getInitialLang() {
      try {
        return normalizeLang(localStorage.getItem('moonBitnaLang'));
      } catch (error) {
        return 'en';
      }
    }

    function setLang(lang) {
      lang = normalizeLang(lang);
      document.documentElement.lang = lang;

      try {
        localStorage.setItem('moonBitnaLang', lang);
      } catch (error) {
        // Continue without persistence if localStorage is unavailable.
      }

      document.querySelectorAll('.lang-switch a').forEach(link => {
        link.classList.toggle('active', link.textContent.toLowerCase() === lang);
      });

      document.querySelectorAll('.i18n, .story-word').forEach(element => {
        if (element.dataset[lang]) {
          element.textContent = element.dataset[lang];
        }
      });

      document.body.style.fontFamily = lang === 'ko'
        ? "var(--font-ko), sans-serif"
        : "var(--font-en), sans-serif";

      if (modal.classList.contains('is-open') && modal.dataset.word) {
        openStory(modal.dataset.word);
      }
    }

    const modal = document.querySelector('#word-modal');
    const modalTitle = modal.querySelector('.word-modal-title');
    const modalCopy = modal.querySelector('.word-modal-copy');
    const snapSections = [...document.querySelectorAll('[data-story]')];
    let wheelDistance = 0;
    let wheelDirection = 0;
    let isSectionScrolling = false;

    function openStory(word) {
      const lang = normalizeLang(document.documentElement.lang);
      const story = profileStories[word][lang];
      modal.dataset.word = word;
      modalTitle.textContent = story.title;
      modalCopy.textContent = story.copy;
      modal.classList.add('is-open');
      modal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function getCurrentSectionIndex() {
      let closestIndex = 0;
      let closestDistance = Infinity;

      snapSections.forEach((section, index) => {
        const distance = Math.abs(section.getBoundingClientRect().top);
        if (distance < closestDistance) {
          closestDistance = distance;
          closestIndex = index;
        }
      });

      return closestIndex;
    }

    window.addEventListener('wheel', event => {
      if (modal.classList.contains('is-open') || Math.abs(event.deltaY) < 2) {
        return;
      }

      event.preventDefault();
      if (isSectionScrolling) {
        return;
      }

      const direction = Math.sign(event.deltaY);
      if (direction !== wheelDirection) {
        wheelDistance = 0;
        wheelDirection = direction;
      }

      wheelDistance += Math.abs(event.deltaY);
      if (wheelDistance < 18) {
        return;
      }

      wheelDistance = 0;

      const currentIndex = getCurrentSectionIndex();
      const targetIndex = Math.min(Math.max(currentIndex + direction, 0), snapSections.length - 1);
      if (targetIndex === currentIndex) {
        return;
      }

      isSectionScrolling = true;
      snapSections[targetIndex].scrollIntoView({
        behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth',
        block: 'start'
      });

      window.setTimeout(() => {
        isSectionScrolling = false;
      }, 850);
    }, { passive: false });

    const storyObserver = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        entry.target.classList.toggle('is-visible', entry.isIntersecting);
      });
    }, { threshold: 0.28, rootMargin: '0px 0px -8% 0px' });

    document.querySelectorAll('[data-story]').forEach(section => storyObserver.observe(section));

    document.querySelectorAll('[data-word]').forEach(button => {
      button.addEventListener('click', () => {
        openStory(button.dataset.word);
      });
    });

    function closeModal() {
      modal.classList.remove('is-open');
      modal.setAttribute('aria-hidden', 'true');
      delete modal.dataset.word;
      document.body.style.overflow = '';
    }

    document.querySelectorAll('[data-close-modal]').forEach(item => item.addEventListener('click', closeModal));
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') closeModal();
    });

    setLang(getInitialLang());
  </script>
</body>
</html>
